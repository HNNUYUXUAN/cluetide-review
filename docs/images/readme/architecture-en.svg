<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740" role="img" aria-labelledby="title desc">
  <title id="title">ClueTide BOT evidence and version architecture</title>
  <desc id="desc">Ethereum observations become a report and downloadable evidence ZIP off-chain. A canonical manifest records the four content files' SHA-256 hashes and byte lengths. Its SHA-256 becomes the contentHash registered on BOT Mainnet 677. Review 1 points to version 1 and its exact content hash. Version 2 has its own content hash and points to version 1 as its parent.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#378f80"/></marker>
    <marker id="arrow-light" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#85d7c5"/></marker>
    <style>text{font-family:Segoe UI,Arial,sans-serif}.title{font-size:29px;font-weight:650;fill:#102b2b}.label{font-size:20px;font-weight:650;letter-spacing:1px}.heading{font-size:25px;font-weight:650}.body{font-size:21px}.small{font-size:19px}.ink{fill:#102b2b}.muted{fill:#476463}.light{fill:#f6f4ed}.teal{fill:#85d7c5}.line{fill:none;stroke:#378f80;stroke-width:3;marker-end:url(#arrow)}.link{fill:none;stroke:#85d7c5;stroke-width:3;marker-end:url(#arrow-light)}</style>
  </defs>
  <rect width="1200" height="740" rx="20" fill="#f6f4ed"/>
  <text x="32" y="53" class="title">From source files to an exact-version history</text>
  <rect x="32" y="88" width="502" height="589" rx="18" fill="#fff" stroke="#cbdad4"/>
  <rect x="584" y="88" width="584" height="589" rx="18" fill="#102b2b"/>
  <text x="64" y="129" class="label muted">OFF-CHAIN · FILE CONTENT</text>
  <text x="616" y="129" class="label teal">BOT MAINNET · 677</text>
  <rect x="64" y="154" width="438" height="86" rx="12" fill="#e8f1eb"/>
  <text x="86" y="189" class="heading ink">Ethereum observations</text>
  <text x="86" y="218" class="body muted">Investigation → report + citations</text>
  <path d="M283 240V281" class="line"/>
  <rect x="64" y="290" width="438" height="213" rx="12" fill="#f6f4ed" stroke="#cbdad4"/>
  <text x="86" y="326" class="heading ink">Downloadable evidence ZIP</text>
  <text x="86" y="361" class="body muted">report.md · report.json</text>
  <text x="86" y="391" class="body muted">evidence.json · raw.json</text>
  <path d="M86 410H480" stroke="#cbdad4"/>
  <text x="86" y="442" class="heading ink">manifest.json</text>
  <text x="86" y="476" class="body muted">Each file: SHA-256 + byte length</text>
  <path d="M283 503V538" class="line"/>
  <rect x="64" y="547" width="438" height="88" rx="12" fill="#d3ece3"/>
  <text x="86" y="583" class="heading ink">SHA-256(manifest.json)</text>
  <text x="86" y="614" class="body muted">Canonical bytes → contentHash</text>
  <text x="616" y="180" class="heading light">Registry stores commitments</text>
  <text x="616" y="213" class="body teal">Author · reviewer · URIs · version links</text>
  <path d="M502 591H556V359H726" class="line"/>
  <text x="599" y="337" class="small teal">contentHash</text>
  <rect x="735" y="310" width="389" height="98" rx="12" fill="#e8f1eb"/>
  <text x="760" y="350" class="heading ink">v1 · original report</text>
  <text x="760" y="382" class="body muted">contentHash + evidence URI</text>
  <path d="M737 514V443H814V410" class="link"/>
  <text x="756" y="474" class="small teal">Bound to v1 + its hash</text>
  <path d="M1019 514V410" class="link"/>
  <text x="1031" y="469" class="small teal">parent: v1</text>
  <rect x="616" y="514" width="243" height="111" rx="12" fill="#234643" stroke="#5b9b8c"/>
  <text x="638" y="555" class="heading light">Review 1</text>
  <text x="638" y="590" class="small teal">reviewHash + decision</text>
  <rect x="900" y="514" width="238" height="111" rx="12" fill="#d3ece3"/>
  <text x="922" y="555" class="heading ink">v2 · correction</text>
  <text x="922" y="590" class="small muted">New contentHash</text>
  <text x="32" y="716" class="body muted">Files stay downloadable. Registry links preserve the exact review target and parent version.</text>
</svg>
